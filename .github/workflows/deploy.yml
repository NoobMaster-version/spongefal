name: Deploy to GitHub Pages

# Deploys the Astro console. Fires on main — merging the `console` branch
# into main IS the go-live switch. Manual runs allowed for previews.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages (auto-enables GitHub Actions as the source)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      #
      # If you still see a red "pages build and deployment" run next to this
      # one, the repo's Pages source is set to "deploy from a branch". GitHub
      # then generates its own Jekyll job, which walks the repo, reads
      # src/**/*.astro as Jekyll front matter and fails. It has never affected
      # what gets published — this workflow's deployment is the one that wins —
      # but it keeps the run list half-red.
      #
      # Fix it once, by hand:
      #   Settings > Pages > Build and deployment > Source: GitHub Actions
      #
      # It cannot be fixed from here. configure-pages above only enables Pages
      # when Pages is off, so it is a no-op on a repo that already has it on;
      # and PUT /repos/{owner}/{repo}/pages with build_type=workflow is
      # rejected for the default GITHUB_TOKEN (verified 2026-09-08 — it lacks
      # the admin scope), so scripting it just adds a warning to every run.
      #
      # Do NOT "fix" the Jekyll error with a .nojekyll file. That makes the
      # Jekyll job succeed and publish the repo root, which still holds the
      # pre-Astro index.html — it would overwrite this build with the old site.
      - run: npm ci
      - run: npx astro check
      - run: npx astro build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
